<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>OpenCV projectPoints Perspective Test</title>

<style>
body{
    font-family: monospace;
    margin:20px;
}
pre{
    border:1px solid #999;
    padding:10px;
    background:#f5f5f5;
    white-space:pre-wrap;
}
</style>

</head>
<body>

<h2>OpenCV projectPoints Perspective Test</h2>

<pre id="log"></pre>

<script>

function log(text)
{
    console.log(text);
    document.getElementById("log").textContent += text + "\n";
}

function printPoint(name,x,y)
{
    log(
        name +
        " = (" +
        x.toFixed(3) +
        ", " +
        y.toFixed(3) +
        ")"
    );
}

function test()
{
    log("");
    log("=================================");
    log("projectPoints Perspective Test");
    log("=================================");

    //------------------------------------------
    // Camera matrix
    //------------------------------------------

    const cameraMatrix = cv.matFromArray(
        3,
        3,
        cv.CV_64F,
        [
            800,0,320,
            0,800,240,
            0,0,1
        ]
    );

    //------------------------------------------
    // Distortion
    //------------------------------------------

    const distCoeffs = cv.Mat.zeros(5,1,cv.CV_64F);

    //------------------------------------------
    // Pose
    //------------------------------------------

    const rvec = cv.Mat.zeros(3,1,cv.CV_64F);

    //------------------------------------------
    // Marker position in camera coordinates
    //------------------------------------------

    const tvec = cv.matFromArray(
        3,
        1,
        cv.CV_64F,
        [

            80,
            50,
            200

        ]
    );

    //------------------------------------------
    // Marker height
    //------------------------------------------

    const markerHeight = 70.0;

    //------------------------------------------
    // 3D points
    //------------------------------------------

    const objectPoints = cv.matFromArray(
        2,
        1,
        cv.CV_32FC3,
        [

            // center of marker

            0,0,0,

            // point directly under marker

            0,0,-markerHeight

        ]
    );

    //------------------------------------------

    const imagePoints = new cv.Mat();

    try
    {

        cv.projectPoints(

            objectPoints,
            rvec,
            tvec,
            cameraMatrix,
            distCoeffs,
            imagePoints

        );

        const x0=imagePoints.floatAt(0,0);
        const y0=imagePoints.floatAt(0,1);

        const x1=imagePoints.floatAt(1,0);
        const y1=imagePoints.floatAt(1,1);

        log("");
        printPoint("Marker center",x0,y0);
        printPoint("Piece base",x1,y1);

        log("");

        log(
            "Shift X = " +
            (x1-x0).toFixed(3)
        );

        log(
            "Shift Y = " +
            (y1-y0).toFixed(3)
        );

        log("");

        log(
            "Distance = " +
            Math.hypot(
                x1-x0,
                y1-y0
            ).toFixed(3)
            +" pixels"
        );

    }
    catch(e)
    {

        log("");
        log("Exception:");
        log(e);

    }

    cameraMatrix.delete();
    distCoeffs.delete();
    rvec.delete();
    tvec.delete();
    objectPoints.delete();
    imagePoints.delete();
}

</script>

<script src="opencv.js"></script>

<script>

if(cv instanceof Promise)
{

    log("cv is Promise");

    cv.then((ready)=>{

        cv=ready;

        log("Promise resolved");

        test();

    });

}
else if(cv.getBuildInformation===undefined)
{

    log("Waiting runtime");

    cv.onRuntimeInitialized=()=>{

        log("Runtime initialized");

        test();

    };

}
else
{

    log("Already initialized");

    test();

}

</script>

</body>
</html>
